<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Вхід для покупців та адміністраторів UrbanWear." />
  <title>Вхід - UrbanWear</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/mobile-store.css" />
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="logo">UrbanWear</a>
      <button class="burger" type="button" aria-label="Відкрити меню">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav class="nav" aria-label="Головна навігація">
        <a href="index.html">Головна</a>
        <a href="catalog.html">Каталог</a>
        <a href="delivery.html">Доставка</a>
        <a href="contacts.html">Контакти</a>
      </nav>
      <a href="catalog.html" class="header__btn">До каталогу</a>
    </div>
  </header>

  <main class="auth-page">
    <section class="container auth-layout">
      <div class="auth-copy">
        <p class="label">Акаунт</p>
        <h1>Вхід у магазин</h1>
        <p>
          Введіть email і пароль. Якщо це дані адміністратора, відкриється панель керування.
          Якщо це покупець, відкриється кабінет покупця.
        </p>
      </div>

      <div class="auth-grid">
        <form class="auth-card" id="loginForm">
          <h2>Вхід</h2>
          <label>Електронна пошта <input type="email" name="email" value="customer@urbanwear.local" required /></label>
          <label>Пароль <input type="password" name="password" value="customer123" required /></label>
          <button type="submit" class="btn btn--dark">Увійти</button>

          <div class="social-login">
            <button type="button" data-social-login="Google">Google</button>
            <button type="button" data-social-login="Facebook">Facebook</button>
            <button type="button" data-social-login="Instagram">Instagram</button>
          </div>

          <p class="auth-note">Соцлогін у статичній версії працює як демо без реального OAuth.</p>
        </form>

        <form class="auth-card" id="registerForm">
          <h2>Реєстрація</h2>
          <label>Ім'я <input type="text" name="name" placeholder="Ваше ім'я" required /></label>
          <label>Електронна пошта <input type="email" name="email" placeholder="you@example.com" required /></label>
          <label>Пароль <input type="password" name="password" placeholder="Мінімум 4 символи" required /></label>
          <button type="submit" class="btn btn--light">Створити акаунт</button>
        </form>

        <p class="form-message auth-message" id="authMessage" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <script src="js/products.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/main.js"></script>
  <script>
    const authMessage = document.getElementById("authMessage");

    function showAuthMessage(message) {
      authMessage.textContent = message;
    }

    document.getElementById("loginForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const data = new FormData(event.currentTarget);
      try {
        const session = UrbanWearAuth.login(data.get("email"), data.get("password"));
        window.location.href = session.role === "admin" ? "admin.html" : "account.html";
      } catch (error) {
        showAuthMessage(error.message);
      }
    });

    document.getElementById("registerForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const data = new FormData(event.currentTarget);
      try {
        UrbanWearAuth.registerCustomer({
          name: data.get("name"),
          email: data.get("email"),
          password: data.get("password"),
        });
        window.location.href = "account.html";
      } catch (error) {
        showAuthMessage(error.message);
      }
    });

    document.querySelectorAll("[data-social-login]").forEach((button) => {
      button.addEventListener("click", () => {
        UrbanWearAuth.socialLogin(button.dataset.socialLogin);
        window.location.href = "account.html";
      });
    });
  </script>
</body>
</html>
