<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Увійдіть або створіть акаунт UrbanWear, щоб керувати замовленнями, кошиком та обраними товарами." />
  <title>Вхід і реєстрація — UrbanWear</title>
  <link rel="stylesheet" href="css/style.css?v=local-categories-1" />
  <link rel="stylesheet" href="css/mobile-store.css?v=local-categories-1" />
  <link rel="stylesheet" href="css/legal.css?v=cookie-consent-1" />
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="logo">UrbanWear</a>
      <button class="burger" type="button" aria-label="Відкрити меню">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav class="nav" aria-label="Головна навігація">
        <a href="index.html">Головна</a>
        <a href="catalog.html">Каталог</a>
        <a href="delivery.html">Доставка</a>
        <a href="contacts.html">Контакти</a>
      </nav>
      <a href="catalog.html" class="header__btn">До каталогу</a>
    </div>
  </header>

  <main class="auth-page">
    <section class="container auth-layout">
      <div class="auth-copy">
        <p class="label">Акаунт</p>
        <h1>Ласкаво просимо!</h1>
        <p>
          Увійдіть у свій акаунт, щоб продовжити покупки та перегляд замовлень.
        </p>
      </div>

      <div class="auth-grid">
        <form class="auth-card" id="loginForm">
          <h2>Вхід</h2>
          <label>Електронна пошта <input type="email" name="email" autocomplete="email" required /></label>
          <label>Пароль <input type="password" name="password" autocomplete="current-password" required /></label>
          <button type="submit" class="btn btn--dark">Увійти</button>

          <div class="social-login">
            <button type="button" data-social-login="Google">Google</button>
            <button type="button" data-social-login="Facebook">Facebook</button>
            <button type="button" data-social-login="Instagram">Instagram</button>
          </div>

          <p class="auth-note">Соціальний вхід стане доступним після підключення OAuth.</p>
        </form>

        <form class="auth-card" id="registerForm">
          <h2>Реєстрація</h2>
          <label>Ім'я <input type="text" name="name" placeholder="Введіть ім’я" required /></label>
          <label>Електронна пошта <input type="email" name="email" placeholder="example@email.com" required /></label>
          <label>Пароль <input type="password" name="password" minlength="10" autocomplete="new-password" placeholder="Мінімум 10 символів" required /></label>
          <label class="auth-consent"><input type="checkbox" name="legalConsent" required /><span>Я погоджуюсь із <a href="terms.html" target="_blank" rel="noopener">публічною офертою</a> та <a href="privacy.html" target="_blank" rel="noopener">політикою конфіденційності</a>.</span></label>
          <button type="submit" class="btn btn--light">Створити акаунт</button>
        </form>

        <p class="form-message auth-message" id="authMessage" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <script src="js/cookies.js?v=consent-1"></script>
  <script src="js/products.js?v=secure-cookie-1"></script>
  <script src="js/auth.js?v=secure-cookie-1"></script>
  <script src="js/analytics.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/main.js?v=local-categories-1"></script>
  <script>
    const authMessage = document.getElementById("authMessage");

    function showAuthMessage(message) {
      authMessage.textContent = message;
    }

    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const data = new FormData(event.currentTarget);
      try {
        await UrbanWearAuth.login(data.get("email"), data.get("password"));
        window.location.href = "account.html";
      } catch (error) {
        showAuthMessage(error.message);
      }
    });

    document.getElementById("registerForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const data = new FormData(event.currentTarget);
      try {
        await UrbanWearAuth.registerCustomer({
          name: data.get("name"),
          email: data.get("email"),
          password: data.get("password"),
          legalConsent: data.get("legalConsent") === "on",
        });
        window.location.href = "account.html";
      } catch (error) {
        showAuthMessage(error.message);
      }
    });

    document.querySelectorAll("[data-social-login]").forEach((button) => {
      button.addEventListener("click", () => {
        UrbanWearAuth.socialLogin(button.dataset.socialLogin);
        window.location.href = "account.html";
      });
    });
  </script>
  <script src="js/demo-mode.js"></script>
</body>
</html>
